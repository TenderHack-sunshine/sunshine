services:
  rag:
    build:
      context: ./rag
      dockerfile: Dockerfile
    environment:
      DATA_DIR: /app/data
      EVIDENCE_SUFFICIENCY_ENABLED: "1"
      # Qdrant and the persistent embedding worker run locally on the demo host.
      # Docker Desktop exposes them through this stable, explicit hostname.
      QDRANT_HOST: host.docker.internal
      DENSE_WORKER_HOST: host.docker.internal
      # Qwen2.5-1.5B-Instruct generation stays in a separate persistent host worker because
      # this lightweight RAG image intentionally contains no model weights.
      GENERATOR_BACKEND: qwen
      GENERATION_WORKER_HOST: host.docker.internal
      GENERATION_WORKER_PORT: "8766"
      GENERATION_MODEL_NAME: Qwen2.5-1.5B-Instruct
      ALLOW_EXTRACTIVE_GENERATION_FALLBACK: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./rag/data:/app/data:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sunshine
      POSTGRES_USER: sunshine
      POSTGRES_PASSWORD: sunshine
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunshine -d sunshine"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://sunshine:sunshine@postgres:5432/sunshine?sslmode=disable
      RAG_SERVICE_URL: http://rag:8000
      JWT_SECRET: ${JWT_SECRET:-sunshine-demo-jwt-secret-change-before-production-2026}
    depends_on:
      postgres:
        condition: service_healthy

  assistant-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://sunshine:sunshine@postgres:5432/sunshine?sslmode=disable
      RAG_SERVICE_URL: http://rag:8000
      RAG_SERVICE_TIMEOUT: ${RAG_SERVICE_TIMEOUT:-30s}
      JWT_SECRET: ${JWT_SECRET:-sunshine-demo-jwt-secret-change-before-production-2026}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Администратор}
    ports:
      - "${API_HOST_PORT:-8081}:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
      rag:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:${API_HOST_PORT:-8081}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      assistant-api:
        condition: service_started

volumes:
  postgres_data:
