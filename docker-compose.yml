services:
  rag:
    build:
      context: ./rag
      dockerfile: Dockerfile
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./rag/data:/app/data:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sunshine
      POSTGRES_USER: sunshine
      POSTGRES_PASSWORD: sunshine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunshine -d sunshine"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://sunshine:sunshine@postgres:5432/sunshine?sslmode=disable
      RAG_SERVICE_URL: http://rag:8000
    depends_on:
      postgres:
        condition: service_healthy

  assistant-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://sunshine:sunshine@postgres:5432/sunshine?sslmode=disable
      RAG_SERVICE_URL: http://rag:8000
      RAG_SERVICE_TIMEOUT: ${RAG_SERVICE_TIMEOUT:-30s}
    ports:
      - "${API_HOST_PORT:-8081}:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
      rag:
        condition: service_healthy

volumes:
  postgres_data:
