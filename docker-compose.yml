services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  embedding:
    build:
      context: ./rag
      dockerfile: Dockerfile.embedding
    volumes:
      - ./rag/models/qwen3-embedding-0.6b:/models/qwen3-embedding-0.6b:ro
    environment:
      MODEL_DIR: /models
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python", "scripts/embedding_worker.py", "--host", "127.0.0.1", "--port", "8765", "--status"]
      interval: 10s
      timeout: 5s
      retries: 18

  generation:
    image: ollama/ollama:latest
    volumes:
      - generation_model_cache:/root/.ollama
    expose:
      - "11434"
    environment:
      GENERATION_OLLAMA_MODEL: qwen3:1.7b
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q 'qwen3:1.7b'"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: on-failure

  model-init:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh"]
    command: ["-c", "until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull \"$$GENERATION_OLLAMA_MODEL\""]
    environment:
      OLLAMA_HOST: http://generation:11434
      GENERATION_OLLAMA_MODEL: qwen3:1.7b
    volumes:
      - generation_model_cache:/root/.ollama
    depends_on:
      generation:
        condition: service_started
    profiles: ["provisioning"]
    restart: on-failure

  indexer:
    build:
      context: ./rag
      dockerfile: Dockerfile
    command: ["python", "scripts/index_official_qdrant.py", "--batch-size", "4", "--log-every", "25"]
    environment:
      DATA_DIR: /app/data
      MODEL_DIR: /models
      QDRANT_HOST: qdrant
      DENSE_WORKER_HOST: embedding
      DENSE_QUERY_TIMEOUT_SECONDS: "120"
    volumes:
      - ./rag/data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
    restart: "no"

  rag:
    build:
      context: ./rag
      dockerfile: Dockerfile
    environment:
      DATA_DIR: /app/data
      EVIDENCE_SUFFICIENCY_ENABLED: "1"
      QDRANT_HOST: qdrant
      DENSE_WORKER_HOST: embedding
      DENSE_QUERY_TIMEOUT_SECONDS: "3"
      GENERATOR_BACKEND: qwen
      GENERATION_WORKER_HOST: generation
      GENERATION_WORKER_PORT: "11434"
      # Retrieval may take up to a few seconds. Reserve the rest of the
      # one-minute end-to-end SLA for a complete synthesized answer.
      GENERATION_MAX_NEW_TOKENS: "256"
      GENERATION_MAX_SECONDS: "50"
      # A compact two-source context leaves CPU time for a finished response.
      GENERATION_MAX_CONTEXT_CHARS: "2400"
      GENERATION_TIMEOUT_SECONDS: "52"
      GENERATION_MAX_EVIDENCE_CHUNKS: "2"
      GENERATION_MODEL_NAME: Qwen3-1.7B
      GENERATION_OLLAMA_MODEL: qwen3:1.7b
      OFFICIAL_INDEX_MANIFEST_PATH: /app/data/processed/index/official_index_manifest.json
      FAQ_CARDS_PATH: /app/data/processed/faq/cards.jsonl
      # Use a grounded fallback only for an actual unavailable/invalid model
      # response; normal requests now have enough time to synthesize.
      ALLOW_EXTRACTIVE_GENERATION_FALLBACK: "0"
    volumes:
      - ./rag/data:/app/data:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      qdrant:
        condition: service_healthy
      generation:
        condition: service_started
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sunshine
      POSTGRES_USER: sunshine
      POSTGRES_PASSWORD: sunshine
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunshine -d sunshine"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://sunshine:sunshine@postgres:5432/sunshine?sslmode=disable
      RAG_SERVICE_URL: http://rag:8000
      JWT_SECRET: ${JWT_SECRET:-sunshine-demo-jwt-secret-change-before-production-2026}
    depends_on:
      postgres:
        condition: service_healthy

  assistant-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://sunshine:sunshine@postgres:5432/sunshine?sslmode=disable
      RAG_SERVICE_URL: http://rag:8000
      # Includes retrieval plus the bounded 50-second local generation call.
      RAG_SERVICE_TIMEOUT: ${RAG_SERVICE_TIMEOUT:-60s}
      JWT_SECRET: ${JWT_SECRET:-sunshine-demo-jwt-secret-change-before-production-2026}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Администратор}
    ports:
      - "${API_HOST_PORT:-8081}:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
      rag:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:${API_HOST_PORT:-8081}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      assistant-api:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  generation_model_cache:
