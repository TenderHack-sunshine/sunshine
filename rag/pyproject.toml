[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-hack-rag"
version = "0.1.0"
description = "Local-first retrieval MVP for the Moscow Supplier Portal"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires local models and Qdrant"]

[tool.setuptools.packages.find]
include = ["src*"]
